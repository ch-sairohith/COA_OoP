[pipeline]
forwarding_enabled = true

[latencies]
ADD = 1
MUL = 3
L   = 3
S   = 2

[memory]
; Virtual memory = 1 MB (2^20 bytes → 256 virtual pages at 4 KB/page)
virtual_size_bytes  = 1048576
; Physical memory = 256 KB = 64 frames × 4 KB
physical_size_bytes = 262144
page_size_bytes     = 4096

[vm]
dtlb_entries       = 16
tlb_hit_latency    = 1
page_walk_latency  = 10
page_fault_latency = 50
replacement_policy = lru

[cache]
l1_size_bytes    = 4096
l1_associativity = 1
l1_latency       = 1
l2_enabled       = false
